<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#111111">
  <title>Fotográfus portfólió</title>
  <meta name="description" content="Fotográfus portfólió: portré, koncert, utazás.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23ebe9e5' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" data-name>Fotográfus</a>
    <nav class="nav" aria-label="Főmenü">
      <a href="#albumok">Albumok</a>
      <a href="#rolam">Rólam</a>
      <a href="#kapcsolat">Kapcsolat</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="hero">
      <div class="hero-text">
        <h1 data-name>Fotográfus</h1>
        <p class="tagline" id="tagline"></p>
        <p class="intro" id="intro"></p>
      </div>
      <div class="hero-albums" id="hero-albums"></div>
    </section>

    <section class="section" id="kiemelt">
      <div class="wrap">
        <h2 class="section-title">Kiemelt képek</h2>
        <div id="featured-grid"></div>
      </div>
    </section>

    <section class="section about" id="rolam">
      <div class="wrap">
        <h2 class="section-title">Rólam</h2>
        <div class="text" id="about-text"></div>
      </div>
    </section>

    <section class="section" id="albumok">
      <div class="wrap">
        <h2 class="section-title">Albumok</h2>
        <div class="albums-grid" id="albums-grid"></div>
      </div>
    </section>

    <section class="section contact" id="kapcsolat">
      <div class="wrap">
        <h2 class="section-title">Kapcsolat</h2>
        <a class="mail" id="mail" href="#"></a>
        <p class="social" id="social"></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">© <span id="year"></span> <span data-name></span></footer>

  <script src="js/common.js"></script>
  <script src="js/lightbox.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
